<svg viewBox="0 0 600 470" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Students reviewing their class timetable">
  <!-- flat backdrop (no gradient) -->
  <circle cx="320" cy="225" r="205" fill="#EAF1FF"/>

  <!-- decorative flat accents -->
  <circle cx="498" cy="300" r="9" fill="#3B6EF6" opacity="0.5"/>
  <circle cx="118" cy="150" r="7" fill="#E7AD29" opacity="0.7"/>
  <path d="M150 92v22M139 103h22" stroke="#E7AD29" stroke-width="4" stroke-linecap="round"/>
  <path d="M512 150v18M503 159h18" stroke="#3B6EF6" stroke-width="4" stroke-linecap="round"/>

  <!-- floating timetable card -->
  <g>
    <rect x="372" y="58" width="186" height="158" rx="16" fill="#FFFFFF" stroke="#E6EBF5" stroke-width="2"/>
    <path d="M372 74a16 16 0 0 1 16-16h154a16 16 0 0 1 16 16v22H372z" fill="#252B5F"/>
    <rect x="388" y="70" width="74" height="10" rx="5" fill="#FFFFFF" opacity="0.85"/>
    <!-- rows -->
    <rect x="388" y="116" width="18" height="18" rx="5" fill="#E7AD29"/>
    <rect x="414" y="119" width="62" height="12" rx="6" fill="#EEF1F8"/>
    <rect x="484" y="119" width="44" height="12" rx="6" fill="#EEF1F8"/>

    <rect x="388" y="150" width="18" height="18" rx="5" fill="#3B6EF6"/>
    <rect x="414" y="153" width="62" height="12" rx="6" fill="#EEF1F8"/>
    <rect x="484" y="153" width="44" height="12" rx="6" fill="#EEF1F8"/>

    <rect x="388" y="184" width="18" height="18" rx="5" fill="#252B5F"/>
    <rect x="414" y="187" width="62" height="12" rx="6" fill="#EEF1F8"/>
    <rect x="484" y="187" width="44" height="12" rx="6" fill="#EEF1F8"/>
  </g>

  <!-- floating chips -->
  <g>
    <rect x="92" y="232" width="118" height="44" rx="12" fill="#FFFFFF" stroke="#E6EBF5" stroke-width="2"/>
    <circle cx="116" cy="254" r="13" fill="#E7F0FF"/>
    <path d="M110 254l4 4 8-8" stroke="#3B6EF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="138" y="247" width="58" height="7" rx="3.5" fill="#252B5F"/>
    <rect x="138" y="259" width="40" height="6" rx="3" fill="#C7D0E4"/>
  </g>

  <!-- desk -->
  <rect x="78" y="374" width="444" height="16" rx="8" fill="#D7DEEC"/>
  <rect x="128" y="390" width="12" height="44" rx="6" fill="#C7D0E4"/>
  <rect x="460" y="390" width="12" height="44" rx="6" fill="#C7D0E4"/>
  <ellipse cx="300" cy="446" rx="190" ry="16" fill="#E4E9F4"/>

  <!-- laptop -->
  <g>
    <rect x="250" y="300" width="120" height="80" rx="9" fill="#2A3357"/>
    <rect x="259" y="309" width="102" height="62" rx="4" fill="#3B6EF6"/>
    <rect x="268" y="318" width="40" height="8" rx="4" fill="#FFFFFF" opacity="0.85"/>
    <rect x="268" y="332" width="84" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>
    <rect x="268" y="344" width="64" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>
    <rect x="232" y="380" width="156" height="12" rx="6" fill="#3A4673"/>
  </g>

  <!-- Figure A (left, afro) -->
  <g>
    <circle cx="190" cy="250" r="40" fill="#211C18"/>
    <circle cx="190" cy="262" r="31" fill="#8B5A2B"/>
    <path d="M159 258a31 31 0 0 1 62 0c-10-12-52-12-62 0z" fill="#211C18"/>
    <rect x="178" y="285" width="24" height="24" fill="#7C4E22"/>
    <path d="M148 392v-44a42 42 0 0 1 84 0v44z" fill="#252B5F"/>
    <path d="M156 392v-40a14 14 0 0 1 28 0v40z" fill="#E7AD29" opacity="0.9"/>
    <rect x="206" y="338" width="60" height="18" rx="9" fill="#252B5F"/>
    <circle cx="262" cy="347" r="11" fill="#8B5A2B"/>
  </g>

  <!-- Figure B (right, short hair) -->
  <g>
    <circle cx="406" cy="252" r="36" fill="#1C1814"/>
    <circle cx="406" cy="264" r="30" fill="#6E4A24"/>
    <rect x="395" y="286" width="22" height="24" fill="#5E3F1F"/>
    <path d="M366 392v-42a40 40 0 0 1 80 0v42z" fill="#3B6EF6"/>
    <path d="M374 392v-38a12 12 0 0 1 24 0v38z" fill="#FFFFFF" opacity="0.25"/>
    <rect x="338" y="338" width="62" height="18" rx="9" fill="#3B6EF6"/>
    <circle cx="344" cy="347" r="11" fill="#6E4A24"/>
  </g>
</svg>
